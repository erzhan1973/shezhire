*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#1a1a1a;font-family:-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
.top{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(26,26,26,0.95);padding:8px 12px;display:flex;align-items:center;gap:10px}
.top .spacer{flex:1}
.top input{background:#2a2a2a;border:1px solid #444;border-radius:20px;padding:5px 14px;color:#ccc;font-size:13px;width:180px;outline:none}
.top input:focus{border-color:#e0b040}
.btn-me{width:30px;height:30px;border-radius:50%;background:#7ab88a;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer}
.btn-tags{height:30px;border-radius:16px;background:#2a2a2a;color:#ccc;border:1px solid #444;font-size:12px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn-tags.on{background:#e0a020;color:#1a1a1a;border-color:#c49020;font-weight:700}
#stage{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden}
#map{position:absolute;top:0;left:0;transform-origin:0 0}
.n{position:absolute;padding:8px 18px;border-radius:22px;font-size:13px;white-space:nowrap;cursor:pointer;border:2px solid transparent}
.n.root{background:#e0b040;color:#1a1a1a;border-color:#c49020;font-weight:700;font-size:14px}
.n.self{background:#e0b040;color:#1a1a1a;border-color:#c49020;font-weight:700;font-size:14px}
.n.zhuz,.n.tribe,.n.clan,.n.ancestor,.n.child{background:#7ab88a;color:#fff}
.n.with-spouse{background:linear-gradient(90deg,#7ab88a 0%,#7ab88a 42%,#9b7ec4 43%,#9b7ec4 100%);color:#fff}
.n .badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:#e0a020;color:#1a1a1a;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.n .badge.show{display:flex}
.n .date{font-size:10px;opacity:0.7;display:block;line-height:1.3}
.n.ex-spouse{opacity:0.65}
.counter{position:fixed;bottom:16px;left:16px;z-index:10;color:rgba(255,255,255,.5);font-size:12px}
.btn-me-floating{position:fixed;bottom:16px;right:16px;z-index:10;width:36px;height:36px;border-radius:50%;background:#e0a020;color:#1a1a1a;font-size:13px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}

  var x1=p._x+(p._w||120),y1=p._y+ROW_H/2,x2=d._x,y2=d._y+ROW_H/2,dx=x2-x1,dy=y2-y1;
  var path=document.createElementNS(NS,"path");
  path.setAttribute("d","M"+x1+","+y1+" C"+(x1+dx*0.4)+","+y1+" "+(x2-dx*0.4)+","+y2+" "+x2+","+y2);
  path.setAttribute("fill","none");path.setAttribute("stroke","#555");path.setAttribute("stroke-width","1.5");

 });

 D.forEach(function(d){
  if(d._dp===undefined||d.t==="spouse")return;

  if(showParentTags&&d.m){var par=M[d.p];var sp=SP[d.p];if(par&&sp&&sp.length>1){var par2=M[d.m];if(par2)label+=" ["+par2.n+"]"}}
  if(d.b||d.d_date){

   if(d.b)label+=d.b;

   label+="</small>";

  var el=document.createElement("div");el.className="n "+cls;el.innerHTML=label;
  el.style.left=d._x+"px";el.style.top=d._y+"px";el.setAttribute("data-i",d.i);
  var cc=(K[d.i]||[]).length;
  if(cc){var b=document.createElement("span");b.className="badge show";b.textContent=cc;el.appendChild(b)}
  el.onclick=function(e){e.stopPropagation();if(suppressClick)return;
   var id=this.getAttribute("data-i");if(!id||!K[id])return;
   if(expanded[id]){(function col(c){delete expanded[c];if(K[c])K[c].forEach(col)})(id)}
   else{var cur=M[id].p;while(cur){expanded[cur]=true;cur=M[cur].p}expanded[id]=true}
   render();centerOn(id,true);
  };
  map.appendChild(el);
 });
 document.getElementById("counter").textContent="Показано "+vc+" из "+D.length;
}

function centerOn(id,follow){
 var n=M[id];if(!n||n._x===undefined)return;
 var anchorX=follow?stage.clientWidth*0.35:stage.clientWidth/2;
 tx=anchorX-n._x*scale-(n._w||120)*scale/2;
 ty=(stage.clientHeight/2)-(n._y+ROW_H/2)*scale;
 tr();
}
function goMe(){
 render();centerOn("y",false);
}
function goRoot(){
 render();tr();
 var vis=D.filter(function(d){return d._dp!==undefined&&d.t!=="spouse"});if(!vis.length)return;
 var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 vis.forEach(function(d){minX=Math.min(minX,d._x);minY=Math.min(minY,d._y);maxX=Math.max(maxX,d._x+(d._w||120));maxY=Math.max(maxY,d._y+ROW_H)});
 tx=(stage.clientWidth-(maxX-minX)*scale)/2-minX*scale;

}
